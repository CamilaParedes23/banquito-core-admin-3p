server:
  port: ${SERVER_PORT}

spring:
  application:
    name: ${SPRING_APPLICATION_NAME}
  datasource:
    url: ${ADMIN_DB_URL}
    username: ${ADMIN_DB_USER}
    password: ${ADMIN_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO}
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL}
        jdbc:
          time_zone: ${APP_TIME_ZONE}
  flyway:
    enabled: ${FLYWAY_ENABLED}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE}
    baseline-version: ${FLYWAY_BASELINE_VERSION}
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_EXPOSURE}
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_DETAILS}

springdoc:
  api-docs:
    path: ${OPENAPI_DOCS_PATH}
  swagger-ui:
    path: ${SWAGGER_UI_PATH}

banquito:
  security:
    jwt:
      issuer: ${JWT_ISSUER}
      secret: ${JWT_SECRET}
  demo:
    enabled: ${DEMO_DATA_ENABLED}
  grpc:
    server:
      port: ${GRPC_SERVER_PORT}
